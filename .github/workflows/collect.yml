name: Collect DBD stats

# Each scheduled run polls Steam every minute for ~24 minutes and pushes every
# change at once. Runs queue behind each other (concurrency below), so the
# collector is effectively always on. The site is republished at the end of
# each run; the page itself also reads fresh data straight from the repo.
on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['site/index.html', 'collect.mjs', '.github/workflows/collect.yml']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Poll Steam stats
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          LOOP_MINUTES: ${{ github.event_name == 'schedule' && '24' || '0' }}
          COMMIT: '1'
        run: |
          git config user.name "dbd-stats-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node collect.mjs

      - name: Prepare site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publish site
        uses: actions/deploy-pages@v4
