name: Collect DBD stats

# Each run polls Steam every minute for ~24 minutes and pushes every change at
# once, then starts the next run itself (workflow_dispatch), so the collector is
# always on. The 20-minute schedule only restarts the chain if it ever stops.
# The page reads the data straight from this repo, so no site deploy is needed
# here (the site itself is published by pages.yml).
on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Poll Steam stats
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          LOOP_MINUTES: '24'
          POLL_SECONDS: '30'
          COMMIT: '1'
        run: |
          git config user.name "dbd-stats-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node collect.mjs

      - name: Start the next run
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run collect.yml --ref main --repo "${{ github.repository }}"
