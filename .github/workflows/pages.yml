name: Publish site

# Publishes the page as soon as its code changes. Stats data is read by the
# page straight from the repo, so data commits do not need a redeploy.
on:
  push:
    branches: [main]
    paths: ['site/index.html', 'site/data/confirmed.json', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
